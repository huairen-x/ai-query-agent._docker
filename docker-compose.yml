version: "3.8"

services:
  # ──────────────────────────────────────────────
  # Mock Upstream (模拟 LLM API)
  # ──────────────────────────────────────────────
  mock-upstream:
    build:
      context: .
      dockerfile: Dockerfile.headroom
    container_name: ai-query-mock
    restart: unless-stopped
    command: python mock_upstream_server.py
    ports:
      - "9999:9999"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9999/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - ai-query-net

  # ──────────────────────────────────────────────
  # Headroom Proxy + Dashboard (本地压缩 + 统计)
  # ──────────────────────────────────────────────
  headroom-proxy:
    build:
      context: .
      dockerfile: Dockerfile.headroom
    container_name: ai-query-headroom
    restart: unless-stopped
    entrypoint: ["/entrypoint.sh"]
    ports:
      - "8787:8787"
    depends_on:
      mock-upstream:
        condition: service_healthy
    environment:
      - HEADROOM_PROXY_PORT=8787
      - HEADROOM_UPSTREAM_URL=http://mock-upstream:9999/v1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ai-query-net

  # ──────────────────────────────────────────────
  # AI Query Agent (LangGraph NL2SQL 引擎)
  # ──────────────────────────────────────────────
  ai-query-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-query-agent
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      headroom-proxy:
        condition: service_started
    environment:
      - MOCK_MODE=true
      - MCP_HTTP_HOST=0.0.0.0
      - MCP_HTTP_PORT=8080
      - HEADROOM_PROXY_URL=http://headroom-proxy:8787
      - HEADROOM_ENABLED=true
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - ai-query-net

networks:
  ai-query-net:
    driver: bridge